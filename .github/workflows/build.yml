name: Build executables

# Manual runs produce downloadable artefacts; pushing a version tag (e.g. v1.0.0)
# also attaches the three executables to the matching GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # needed to attach binaries to the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  asset: RubriPDF-linux }
          - { os: windows-latest, asset: RubriPDF-windows.exe }
          # macOS left out for now (no Mac to test the binary on). Re-enable when
          # a Mac is available — GitHub's macos-latest runner builds it just fine:
          # - { os: macos-latest,   asset: RubriPDF-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build executable
        run: pyinstaller --noconfirm --clean rubripdf.spec

      - name: Stage binary and checksum
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/RubriPDF.exe "out/${{ matrix.asset }}"
          else
            cp dist/RubriPDF "out/${{ matrix.asset }}"
          fi
          cd out
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.asset }}*
