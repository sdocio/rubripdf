<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubriPDF</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons.css') }}" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .section-card { margin-bottom: 1rem; border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .section-card .card-header {
      background: #fff; font-weight: 600; font-size: .9rem;
      border-bottom: 1px solid #e9ecef; padding: .65rem 1rem;
    }
    .crit-row {
      display: flex; align-items: center; gap: .4rem;
      background: #fff; border: 1px solid #e9ecef; border-radius: 4px;
      padding: .35rem .5rem; margin-bottom: .35rem;
    }
    .crit-row .cnum { color: #adb5bd; font-size: .8rem; min-width: 1.4rem; text-align: right; }
    .crit-grip { cursor: grab; color: #ced4da; }
    .crit-grip:active { cursor: grabbing; }
    .student-item {
      display: flex; align-items: center;
      background: #fff; border: 1px solid #e9ecef; border-radius: 4px;
      padding: .3rem .5rem; margin-bottom: .3rem; font-size: .88rem;
      cursor: grab; user-select: none;
      break-inside: avoid;
    }
    .student-item:active { cursor: grabbing; }
    .student-item .snum { color: #adb5bd; font-size: .75rem; min-width: 1.8rem; }
    .student-item .sname { flex: 1; }
    .drag-over { border: 2px dashed #0d6efd !important; background: #e8f0fe !important; }
    #status { font-size: .82rem; min-height: 1.4rem; }
    .navbar-brand { font-size: 1rem; font-weight: 700; }
    .form-label { font-size: .85rem; margin-bottom: .25rem; }
    .form-control-sm, .form-select-sm { font-size: .85rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary py-2 mb-3">
  <div class="container-fluid">
    <span class="navbar-brand"><i class="bi bi-file-earmark-text-fill me-1"></i>RubriPDF<small class="fw-normal ms-2" style="font-size:.72rem;opacity:.8" data-i18n="appTitle">Evaluation sheet generator</small></span>
    <div class="d-flex gap-2 align-items-center">
      <select class="form-select form-select-sm" id="ui-lang" onchange="changeUiLang(this.value)"
              style="width:auto;background-color:#fff;font-size:.8rem">
        <option value="gl">Galego</option>
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
      <button class="btn btn-sm btn-light" onclick="saveConfig()" data-i18n-title="btnSaveConfig" title="Save configuration to JSON">
        <i class="bi bi-floppy"></i> <span data-i18n="btnSaveConfig">Save config</span>
      </button>
      <label class="btn btn-sm btn-light mb-0" data-i18n-title="btnLoadConfig" title="Load configuration from JSON">
        <i class="bi bi-folder2-open"></i> <span data-i18n="btnLoadConfig">Load config</span>
        <input type="file" accept=".json" onchange="loadConfig(event)" hidden>
      </label>
      <button class="btn btn-sm btn-light" onclick="openHelp()" data-i18n-title="btnHelp" title="Help">
        <i class="bi bi-question-circle"></i> <span data-i18n="btnHelp">Help</span>
      </button>
    </div>
  </div>
</nav>

<div class="container-fluid px-3">
<div class="row g-3">

<!-- ═══════════════════════ LEFT COLUMN ═══════════════════════ -->
<div class="col-lg-7">

  <!-- Document settings -->
  <div class="card section-card">
    <div class="card-header"><i class="bi bi-gear me-1"></i><span data-i18n="hDocSettings">Document Settings</span></div>
    <div class="card-body pb-2">
      <div class="row g-2">
        <div class="col-sm-8">
          <label class="form-label" data-i18n="labelSubject">Subject</label>
          <input type="text" class="form-control form-control-sm" id="subject"
                 data-i18n-ph="placeholderSubject" placeholder="e.g. Introduction to Robotics">
        </div>
        <div class="col-sm-4">
          <label class="form-label" data-i18n="labelYear">Academic year</label>
          <input type="text" class="form-control form-control-sm" id="year"
                 data-i18n-ph="placeholderYear" placeholder="e.g. 2025/26">
        </div>
        <div class="col-12">
          <label class="form-label" data-i18n="labelTitle">Title</label>
          <input type="text" class="form-control form-control-sm" id="title"
                 data-i18n-ph="placeholderTitle" placeholder="e.g. Exam correction">
        </div>
        <div class="col-sm-6">
          <label class="form-label" data-i18n="labelLanguage">Language</label>
          <select class="form-select form-select-sm" id="language">
            <option value="galician"   data-i18n="optLangGl">Galician</option>
            <option value="spanish"    data-i18n="optLangEs">Spanish</option>
            <option value="english"    data-i18n="optLangEn">English</option>
            <option value="portuguese" data-i18n="optLangPt">Portuguese</option>
          </select>
        </div>
        <div class="col-sm-6">
          <label class="form-label" data-i18n="labelColor">Header colour</label>
          <div class="input-group input-group-sm">
            <input type="color" class="form-control form-control-color form-control-sm"
                   id="color-hex" value="#d2ebe6" oninput="syncColorFromHex()" data-i18n-title="labelColor" title="Pick colour">
            <input type="text" class="form-control form-control-sm" id="color-rgb"
                   value="210,235,230" placeholder="R,G,B" oninput="syncColorFromRgb()"
                   style="max-width:100px">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Marking criteria -->
  <div class="card section-card">
    <div class="card-header"><i class="bi bi-list-check me-1"></i><span data-i18n="hCriteria">Marking Criteria</span></div>
    <div class="card-body pb-2">
      <div id="criteria-list"></div>
      <div class="d-flex justify-content-between align-items-center mt-1">
        <button class="btn btn-sm btn-outline-primary" onclick="addCriterion()">
          <i class="bi bi-plus-lg"></i> <span data-i18n="btnAddCriterion">Add criterion</span>
        </button>
        <span class="small text-muted">
          <span data-i18n="labelTotalPts">Total points</span>:
          <span id="crit-total" class="fw-semibold">0</span>
        </span>
      </div>
    </div>
  </div>

</div><!-- /left -->

<!-- ═══════════════════════ RIGHT COLUMN ═══════════════════════ -->
<div class="col-lg-5">

  <!-- Output options -->
  <div class="card section-card">
    <div class="card-header"><i class="bi bi-sliders me-1"></i><span data-i18n="hOutputOptions">Output Options</span></div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-sm-6">
          <label class="form-label" data-i18n="labelObsPages">Extra note pages per student</label>
          <input type="number" class="form-control form-control-sm" id="obs-pages"
                 value="1" min="0" max="10">
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="obs-template" checked>
            <label class="form-check-label small" for="obs-template"
                   data-i18n="labelObsTemplate">Guide the first notes box with the rubric items</label>
          </div>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="derive-points">
            <label class="form-check-label small" for="derive-points"
                   data-i18n="labelDerivePoints">Derive the points from the achievement level</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Generate -->
  <div class="card section-card">
    <div class="card-header"><i class="bi bi-lightning-charge me-1"></i><span data-i18n="hGenerate">Generate</span></div>
    <div class="card-body">
      <div class="d-grid gap-2">
        <button class="btn btn-success" id="pdf-btn" onclick="generatePdf()">
          <i class="bi bi-file-pdf-fill"></i> <span data-i18n="btnGeneratePdf">Generate PDF</span>
        </button>
      </div>
      <div id="status" class="mt-2 text-muted"></div>
      <hr class="my-3">
      <label class="form-label" data-i18n="labelExtract">Extract grades from filled PDF</label>
      <div class="input-group input-group-sm">
        <input type="file" class="form-control form-control-sm" id="extract-file" accept=".pdf">
        <button class="btn btn-outline-secondary" id="extract-btn" onclick="extractGrades()">
          <i class="bi bi-table"></i> <span data-i18n="btnExtract">Extract CSV</span>
        </button>
      </div>
      <div class="form-check form-check-sm mt-1">
        <input class="form-check-input" type="checkbox" id="extract-detailed">
        <label class="form-check-label small text-muted" for="extract-detailed"
               data-i18n="labelDetailedCsv">Detailed CSV (per criterion)</label>
      </div>
      <div id="extract-status" class="mt-2 text-muted" style="font-size:.82rem"></div>
      <div id="extract-warnings" style="font-size:.82rem"></div>
    </div>
  </div>

</div><!-- /right -->
</div><!-- /row -->

<!-- ═══════════════════════ STUDENTS (full width) ═══════════════════════ -->
<div class="row g-3 mt-0">
<div class="col-12">
  <div class="card section-card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>
        <i class="bi bi-people me-1"></i><span data-i18n="hStudents">Students</span>
        <span class="badge bg-secondary ms-1" id="student-count">0</span>
      </span>
      <div class="d-flex gap-1">
        <label class="btn btn-sm btn-primary mb-0 fw-semibold" data-i18n-title="titleCsv" title="Import from CSV / XLS">
          <i class="bi bi-filetype-csv"></i> CSV / XLS
          <input type="file" accept=".txt,.csv,.tsv,.xls,.xlsx" onchange="handleFile(event)" hidden>
        </label>
        <button class="btn btn-sm btn-outline-secondary" onclick="toggleAddForm()" data-i18n-title="titleAddManual" title="Add manually">
          <i class="bi bi-person-plus"></i>
        </button>
      </div>
    </div>
    <div class="card-body">

      <!-- CSV column selector -->
      <div id="csv-col-row" class="mb-2" style="display:none">
        <label class="form-label" data-i18n="labelNameColumn">Name column</label>
        <select class="form-select form-select-sm" id="csv-col" onchange="reParseCsv()"></select>
      </div>

      <!-- Manual add -->
      <div id="add-form" style="display:none" class="mb-2">
        <div class="input-group input-group-sm" style="max-width:500px">
          <input type="text" class="form-control" id="add-name"
                 data-i18n-ph="placeholderAddStudent"
                 placeholder="Name (Enter to add, semicolons for multiple)"
                 onkeydown="if(event.key==='Enter')doAddStudent()">
          <button class="btn btn-primary" onclick="doAddStudent()" data-i18n="btnAdd">Add</button>
        </div>
      </div>

      <!-- Student list -->
      <div id="student-list" style="columns: 3 220px; column-gap: .75rem;"></div>
      <div id="no-students" class="text-muted small" data-i18n="noStudents">No students yet.</div>

      <div class="d-flex justify-content-between align-items-center mt-2">
        <small class="text-muted" data-i18n="dragReorder">Drag rows to reorder</small>
        <button id="clear-btn" class="btn btn-sm btn-link text-danger p-0" onclick="clearStudents()" style="display:none">
          <i class="bi bi-trash"></i> <span data-i18n="btnClearAll">Clear all</span>
        </button>
      </div>

    </div>
  </div>
</div>
</div><!-- /students row -->

</div><!-- /container -->

<!-- Warnings modal (populated by renderWarnings) -->
<div class="modal fade" id="warnings-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="warnings-modal-title">Avisos</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ul class="list-unstyled mb-0" id="warnings-modal-body"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Help modal (populated by openHelp) -->
<div class="modal fade" id="help-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="help-modal-title">Help</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="help-modal-body"></div>
    </div>
  </div>
</div>

let uiLang = 'en';

function detectLang() {
  const saved = localStorage.getItem('uiLang');
  if (saved && T[saved]) return saved;
  const l = (navigator.language || 'en').toLowerCase();
  if (l.startsWith('gl')) return 'gl';
  if (l.startsWith('es')) return 'es';
  if (l.startsWith('pt')) return 'pt';
  return 'en';
}

function changeUiLang(lang) {
  uiLang = lang;
  localStorage.setItem('uiLang', lang);
  applyTranslations();
  renderCriteria();
  renderStudents();
}

// Get a static string
function _t(key) { return (T[uiLang] || T.en)[key] || key; }

// Get a dynamic string (function)
function _tf(key, ...args) {
  const v = (T[uiLang] || T.en)[key];
  return typeof v === 'function' ? v(...args) : (v || key);
}

function applyTranslations() {
  document.documentElement.lang = uiLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = _t(el.dataset.i18n);
    if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const v = _t(el.dataset.i18nPh);
    if (v) el.placeholder = v;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const v = _t(el.dataset.i18nTitle);
    if (v) el.title = v;
  });
}

// ─── state ───────────────────────────────────────────────────────────────────
let criteria = [{ description: '', points: 1 }];
let students = [];

// ─── init ────────────────────────────────────────────────────────────────────
// Current academic year in "YYYY/YY" form. The year rolls over in September:
// Sep–Dec → Y/Y+1, Jan–Aug → Y-1/Y.
function currentAcademicYear() {
  const now = new Date();
  const start = now.getMonth() + 1 >= 9 ? now.getFullYear() : now.getFullYear() - 1;
  return `${start}/${String((start + 1) % 100).padStart(2, '0')}`;
}

document.addEventListener('DOMContentLoaded', () => {
  uiLang = detectLang();
  document.getElementById('ui-lang').value = uiLang;
  applyTranslations();
  restoreState();
  // Pre-fill the academic year if empty (still editable, and never overwrites
  // a value restored from localStorage or a loaded config).
  const yearEl = document.getElementById('year');
  if (!yearEl.value.trim()) yearEl.value = currentAcademicYear();
  renderCriteria();
  renderStudents();
  // Persist document settings whenever they change
  ['title', 'subject', 'year', 'language', 'color-rgb', 'color-hex', 'obs-pages', 'obs-template', 'derive-points']
    .forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input',  persistState);
      el.addEventListener('change', persistState);
    });
});

// ─── colour sync ─────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  return [1,3,5].map(i => parseInt(hex.slice(i, i+2), 16)).join(',');
}
function rgbToHex(rgb) {
  const p = rgb.split(',').map(s => Math.max(0, Math.min(255, parseInt(s.trim()) || 0)));
  return p.length === 3 ? '#' + p.map(v => v.toString(16).padStart(2,'0')).join('') : '#d2ebe6';
}
function syncColorFromHex() {
  document.getElementById('color-rgb').value = hexToRgb(document.getElementById('color-hex').value);
}
function syncColorFromRgb() {
  document.getElementById('color-hex').value = rgbToHex(document.getElementById('color-rgb').value);
}

// ─── criteria ────────────────────────────────────────────────────────────────
function addCriterion() {
  criteria.push({ description: '', points: 1 });
  renderCriteria();
  persistState();
}

function removeCriterion(i) {
  if (criteria.length > 1) { criteria.splice(i, 1); renderCriteria(); persistState(); }
}

function setCritField(i, field, val) {
  criteria[i][field] = field === 'points' ? (parseFloat(val) || 0) : val;
  if (field === 'points') updateCritTotal();
  persistState();
}

function updateCritTotal() {
  const total = criteria.reduce((s, c) => s + (parseFloat(c.points) || 0), 0);
  const el = document.getElementById('crit-total');
  if (el) el.textContent = Number.isInteger(total) ? total : total.toFixed(2);
}

function renderCriteria() {
  const c = document.getElementById('criteria-list');
  c.innerHTML = '';
  criteria.forEach((cr, i) => {
    const row = document.createElement('div');
    row.className = 'crit-row';
    row.dataset.i = i;
    row.innerHTML = `
      <i class="bi bi-grip-vertical crit-grip" title="${esc(_t('dragReorder'))}"></i>
      <span class="cnum">${i+1}.</span>
      <input type="text" class="form-control form-control-sm flex-grow-1"
             placeholder="${esc(_t('placeholderCriterion'))}" value="${esc(cr.description)}"
             oninput="setCritField(${i},'description',this.value)">
      <input type="number" class="form-control form-control-sm text-end" style="width:75px"
             step="0.25" min="0" value="${cr.points}"
             oninput="setCritField(${i},'points',this.value)">
      <span class="text-muted small">${esc(_t('ptsLabel'))}</span>
      <button class="btn btn-sm btn-outline-danger py-0 px-1" title="Remove"
              onclick="removeCriterion(${i})" ${criteria.length <= 1 ? 'disabled' : ''}>
        <i class="bi bi-x-lg"></i>
      </button>`;
    const grip = row.querySelector('.crit-grip');
    grip.draggable = true;
    grip.addEventListener('dragstart', e => {
      _critFrom = i; e.dataTransfer.effectAllowed = 'move';
    });
    grip.addEventListener('dragend', critDragEnd);
    row.addEventListener('dragover',  critDragOver);
    row.addEventListener('dragleave', critDragLeave);
    row.addEventListener('drop',      critDrop);
    c.appendChild(row);
  });
  updateCritTotal();
}

// Drag & drop to reorder criteria (only the grip handle is draggable)
let _critFrom = null;
function critDragOver(e)  { e.preventDefault(); this.classList.add('drag-over'); }
function critDragLeave()  { this.classList.remove('drag-over'); }
function critDragEnd()    { document.querySelectorAll('.crit-row.drag-over').forEach(el => el.classList.remove('drag-over')); }
function critDrop(e) {
  e.preventDefault();
  this.classList.remove('drag-over');
  const to = +this.dataset.i;
  if (_critFrom === null || _critFrom === to) return;
  const moved = criteria.splice(_critFrom, 1)[0];
  criteria.splice(to, 0, moved);
  _critFrom = null;
  renderCriteria();
  persistState();
}

// ─── students ────────────────────────────────────────────────────────────────
function toggleAddForm() {
  const f = document.getElementById('add-form');
  f.style.display = f.style.display === 'none' ? '' : 'none';
  if (f.style.display !== 'none') document.getElementById('add-name').focus();
}

function doAddStudent() {
  const inp   = document.getElementById('add-name');
  const names = inp.value.split(';').map(s => s.trim()).filter(Boolean);
  if (!names.length) return;
  students.push(...names);
  renderStudents();
  persistState();
  inp.value = '';
  inp.focus();
}

let xlsRows = null;  // cached rows for xls column re-selection

function handleFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const isXls = ext === 'xls' || ext === 'xlsx';
  const fd = new FormData();
  fd.append('file', file);
  setStatus(_t('statusParsingCsv'));
  fetch(isXls ? '/parse-xls' : '/parse-csv', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(d => {
      if (d.error) { setStatus(d.error, 'danger'); return; }
      xlsRows = d.rows || null;   // spreadsheet rows for local column re-selection
      const sel = document.getElementById('csv-col');
      sel.innerHTML = (d.columns || []).map(c =>
        `<option value="${esc(c)}" ${c === d.selected_column ? 'selected' : ''}>${esc(c)}</option>`
      ).join('');
      document.getElementById('csv-col-row').style.display = d.columns.length > 1 ? '' : 'none';
      students = d.students || [];
      renderStudents();
      persistState();
      const fmtKey = { moodle: 'fmtMoodle', usc: 'fmtUsc' }[d.format];
      if (d.note === 'inferred_columns') {
        setStatus(_tf('statusImportedInferred', students.length), 'warning');
      } else if (d.note === 'looks_multicolumn') {
        setStatus(_tf('statusMaybeMulticolumn', students.length), 'warning');
      } else if (d.duplicates > 0) {
        setStatus(_tf('statusDuplicates', students.length, d.duplicates), 'warning');
      } else if (fmtKey) {
        setStatus(_tf('statusImported', students.length, _t(fmtKey)), 'success');
      } else {
        setStatus(_tf('statusLoadedStudents', students.length), 'success');
      }
    })
    .catch(() => setStatus(_t('statusErrorCsv'), 'danger'));
  event.target.value = '';
}

function reParseCsv() {
  // Re-pick the name column of an imported spreadsheet, locally.
  if (!xlsRows) return;
  const col = document.getElementById('csv-col').value;
  students = xlsRows.map(r => (r[col] || '').trim()).filter(Boolean);
  renderStudents();
  persistState();
}

function clearStudents() {
  if (!confirm(_tf('confirmClear', students.length))) return;
  students = [];
  xlsRows = null;
  document.getElementById('csv-col-row').style.display = 'none';
  renderStudents();
  persistState();
}

function removeStudent(i) {
  students.splice(i, 1);
  renderStudents();
  persistState();
}

function renderStudents() {
  const list = document.getElementById('student-list');
  const none = document.getElementById('no-students');
  document.getElementById('student-count').textContent = students.length;
  document.getElementById('clear-btn').style.display = students.length ? '' : 'none';
  none.style.display = students.length ? 'none' : '';
  list.innerHTML = '';

  students.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'student-item';
    div.draggable = true;
    div.dataset.i = i;
    div.innerHTML = `
      <i class="bi bi-grip-vertical text-muted me-1"></i>
      <span class="snum">${i+1}.</span>
      <span class="sname">${esc(s)}</span>
      <button class="btn btn-sm btn-link text-danger p-0 ms-1" onclick="removeStudent(${i})" title="Remove">
        <i class="bi bi-x-circle"></i>
      </button>`;
    div.addEventListener('dragstart', dragStart);
    div.addEventListener('dragover',  dragOver);
    div.addEventListener('dragleave', dragLeave);
    div.addEventListener('drop',      dragDrop);
    div.addEventListener('dragend',   dragEnd);
    list.appendChild(div);
  });
}

// Drag & drop
let _dragFrom = null;
function dragStart(e) {
  _dragFrom = +this.dataset.i;
  e.dataTransfer.effectAllowed = 'move';
}
function dragOver(e) {
  e.preventDefault();
  this.classList.add('drag-over');
}
function dragLeave() { this.classList.remove('drag-over'); }
function dragEnd()   { document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }
function dragDrop(e) {
  e.preventDefault();
  this.classList.remove('drag-over');
  const to = +this.dataset.i;
  if (_dragFrom === null || _dragFrom === to) return;
  const moved = students.splice(_dragFrom, 1)[0];
  students.splice(to, 0, moved);
  _dragFrom = null;
  renderStudents();
  persistState();
}

// ─── config save / load ──────────────────────────────────────────────────────
function getConfig() {
  // parseInt || 1 would turn a legitimate 0 into 1 (0 is falsy); handle NaN explicitly
  const obsRaw = parseInt(document.getElementById('obs-pages').value, 10);
  return {
    title:     document.getElementById('title').value,
    subject:   document.getElementById('subject').value,
    year:      document.getElementById('year').value,
    language:  document.getElementById('language').value,
    color:     document.getElementById('color-rgb').value,
    obs_pages: Number.isNaN(obsRaw) ? 1 : Math.max(0, Math.min(obsRaw, 20)),
    obs_template: document.getElementById('obs-template').checked,
    derive_points: document.getElementById('derive-points').checked,
    criteria:  criteria.map(c => ({ description: c.description, points: parseFloat(c.points) || 0 })),
  };
}

function getGeneratePayload() {
  return { ...getConfig(), students };
}

// ─── state persistence (localStorage) ──────────────────────────────────────────
const STATE_KEY = 'examSheetState';

function persistState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ config: getConfig(), students }));
  } catch (_) { /* storage full or unavailable — ignore */ }
}

function restoreState() {
  let raw;
  try { raw = localStorage.getItem(STATE_KEY); } catch (_) { return; }
  if (!raw) return;
  let s;
  try { s = JSON.parse(raw); } catch (_) { return; }
  const cfg = s.config || {};
  if (cfg.title    !== undefined) document.getElementById('title').value   = cfg.title;
  if (cfg.subject  !== undefined) document.getElementById('subject').value = cfg.subject;
  if (cfg.year     !== undefined) document.getElementById('year').value    = cfg.year;
  if (cfg.language) document.getElementById('language').value = cfg.language;
  if (cfg.color) {
    document.getElementById('color-rgb').value = cfg.color;
    document.getElementById('color-hex').value = rgbToHex(cfg.color);
  }
  if (cfg.obs_pages !== undefined) document.getElementById('obs-pages').value = cfg.obs_pages;
  if (cfg.obs_template !== undefined) document.getElementById('obs-template').checked = cfg.obs_template;
  if (cfg.derive_points !== undefined) document.getElementById('derive-points').checked = cfg.derive_points;
  if (Array.isArray(cfg.criteria) && cfg.criteria.length)
    criteria = cfg.criteria.map(c => ({ ...c }));
  if (Array.isArray(s.students)) students = s.students;
}

function saveConfig() {
  const blob = new Blob([JSON.stringify(getConfig(), null, 2)], { type: 'application/json' });
  triggerDownload(blob, 'exam-config.json');
}

function loadConfig(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const cfg = JSON.parse(e.target.result);
      if (cfg.title    !== undefined) document.getElementById('title').value   = cfg.title;
      if (cfg.subject  !== undefined) document.getElementById('subject').value = cfg.subject;
      if (cfg.year     !== undefined) document.getElementById('year').value    = cfg.year;
      if (cfg.language) document.getElementById('language').value = cfg.language;
      if (cfg.color) {
        document.getElementById('color-rgb').value = cfg.color;
        document.getElementById('color-hex').value = rgbToHex(cfg.color);
      }
      if (cfg.obs_pages !== undefined) document.getElementById('obs-pages').value = cfg.obs_pages;
      if (cfg.obs_template !== undefined) document.getElementById('obs-template').checked = cfg.obs_template;
  if (cfg.derive_points !== undefined) document.getElementById('derive-points').checked = cfg.derive_points;
      if (cfg.criteria) { criteria = cfg.criteria.map(c => ({...c})); renderCriteria(); }
      persistState();
      setStatus(_t('statusConfigLoaded'), 'success');
    } catch(err) {
      setStatus(_tf('statusConfigError', err.message), 'danger');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ─── generate ────────────────────────────────────────────────────────────────
function generatePdf() {
  if (!validate()) return;
  const btn = document.getElementById('pdf-btn');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${esc(_t('statusGenerating'))}`;
  setStatus(_t('statusGenerating'));

  fetch('/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(getGeneratePayload()),
  })
    .then(async r => {
      const ct = r.headers.get('content-type') || '';
      if (r.ok && ct.includes('pdf')) {
        const blob = await r.blob();
        triggerDownload(blob, 'evaluation.pdf');
        setStatus(_t('statusGenerated'), 'success');
      } else {
        let msg = '';
        try { const d = await r.json(); msg = d.error || ''; } catch(_) {}
        setStatus(_tf('statusFailed', msg), 'danger');
      }
    })
    .catch(err => setStatus(_tf('statusFailed', err.message), 'danger'))
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = `<i class="bi bi-file-pdf-fill"></i> ${esc(_t('btnGeneratePdf'))}`;
    });
}

// ─── extract ─────────────────────────────────────────────────────────────────
function extractGrades() {
  const input = document.getElementById('extract-file');
  if (!input.files.length) {
    setExtractStatus(_t('statusExtractNoFile'), 'danger');
    return;
  }
  const btn = document.getElementById('extract-btn');
  btn.disabled = true;
  setExtractStatus(_t('statusExtracting'));

  document.getElementById('extract-warnings').innerHTML = '';
  const fd = new FormData();
  fd.append('file', input.files[0]);
  fd.append('lang', uiLang);   // decimal separator / CSV delimiter follow the UI language
  if (document.getElementById('extract-detailed').checked) fd.append('detailed', '1');
  fetch('/extract', { method: 'POST', body: fd })
    .then(async r => {
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.csv !== undefined) {
        // Prepend a BOM so Excel opens the UTF-8 CSV correctly
        const blob = new Blob(['﻿' + d.csv], { type: 'text/csv;charset=utf-8' });
        triggerDownload(blob, 'grades.csv');
        setExtractStatus(_t('statusExtracted'), 'success');
        renderWarnings(d.warnings);
      } else {
        const msg = d.error === 'no_fields'
          ? _t('statusExtractNoFields')
          : _tf('statusExtractError', d.error || '');
        setExtractStatus(msg, 'danger');
      }
    })
    .catch(err => setExtractStatus(_tf('statusExtractError', err.message), 'danger'))
    .finally(() => { btn.disabled = false; });
}

// Render the structured quality-check warnings returned by /extract:
// an inline summary + a "view details" button that opens a scrollable modal.
let _warnModal = null;
function renderWarnings(warnings) {
  const box  = document.getElementById('extract-warnings');
  const body = document.getElementById('warnings-modal-body');
  if (!warnings || !warnings.length) {
    box.innerHTML = `<div class="text-success mt-2">` +
      `<i class="bi bi-check-circle-fill me-1"></i>${esc(_t('extractNoIssues'))}</div>`;
    body.innerHTML = '';
    return;
  }
  const dec  = uiLang === 'en' ? '.' : ',';   // match the exported CSV's decimal
  const nfmt = x => String(+Number(x).toFixed(2)).replace('.', dec);
  const build = w => {
    const c = (w.c || []).map(i => i + 1).join(', ');
    switch (w.t) {
      case 'crit_empty':     return { lvl: 'warn', msg: _tf('wCritEmpty', w.s, c) };
      case 'crit_nan':       return { lvl: 'warn', msg: _tf('wCritNan', w.s, c) };
      case 'crit_over':      return { lvl: 'warn', msg: _tf('wCritOver', w.s, w.c + 1, nfmt(w.v), nfmt(w.max)) };
      case 'np_has_grades':  return { lvl: 'warn', msg: _tf('wNpHasGrades', w.s) };
      case 'final_empty':    return { lvl: 'warn', msg: _tf('wFinalEmpty', w.s) };
      case 'final_autofill': return { lvl: 'info', msg: _tf('wFinalAutofill', w.s, nfmt(w.v)) };
      case 'final_nan':      return { lvl: 'warn', msg: _tf('wFinalNan', w.s, w.v) };
      case 'final_mismatch': return { lvl: 'warn', msg: _tf('wFinalMismatch', w.s, nfmt(w.f), nfmt(w.sum)) };
      default:               return { lvl: 'warn', msg: '' };
    }
  };

  // Full list into the modal body
  const rows = warnings.map(build);
  body.innerHTML = rows.map(({ lvl, msg }) => {
    const ic = lvl === 'info'
      ? 'bi-info-circle-fill text-primary'
      : 'bi-exclamation-triangle-fill text-warning';
    return `<li class="d-flex align-items-start gap-2 mb-2">` +
           `<i class="bi ${ic} mt-1"></i><span>${esc(msg)}</span></li>`;
  }).join('');
  document.getElementById('warnings-modal-title').textContent =
    _tf('extractWarnTitle', warnings.length);

  // Inline summary + open-modal button
  const hasWarn  = rows.some(r => r.lvl === 'warn');
  const sumIcon  = hasWarn ? 'bi-exclamation-triangle-fill text-warning'
                           : 'bi-info-circle-fill text-primary';
  box.innerHTML = `<div class="mt-2 d-flex align-items-center gap-2 flex-wrap">` +
    `<span><i class="bi ${sumIcon} me-1"></i>${esc(_tf('extractWarnTitle', warnings.length))}</span>` +
    `<button type="button" class="btn btn-sm btn-outline-secondary py-0" id="warn-details-btn">` +
    `${esc(_t('extractViewDetails'))}</button></div>`;
  document.getElementById('warn-details-btn').addEventListener('click', () => {
    if (!_warnModal) _warnModal = new bootstrap.Modal(document.getElementById('warnings-modal'));
    _warnModal.show();
  });
}

function setExtractStatus(msg, type = 'info') {
  document.getElementById('extract-status').innerHTML =
    `<span class="text-${type === 'info' ? 'muted' : type}">` +
    `<i class="bi bi-${_icons[type] || _icons.info} me-1"></i>${esc(msg)}</span>`;
}

// ─── integrated help manual ──────────────────────────────────────────────────
// Content is Markdown in help/<lang>.md, served by /help/<lang> (see app.py).
let _helpModal = null;
function openHelp() {
  document.getElementById('help-modal-title').textContent = _t('helpTitle');
  const body = document.getElementById('help-modal-body');
  body.innerHTML = '';
  fetch('/help/' + uiLang)
    .then(r => r.ok ? r.text() : "")
    .then(html => { body.innerHTML = html; });
  if (!_helpModal) _helpModal = new bootstrap.Modal(document.getElementById('help-modal'));
  _helpModal.show();
}

// ─── helpers ─────────────────────────────────────────────────────────────────
function validate() {
  if (!students.length)  { setStatus(_t('statusAddStudent'),  'danger'); return false; }
  if (!criteria.length)  { setStatus(_t('statusAddCriterion'), 'danger'); return false; }
  return true;
}

function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a   = Object.assign(document.createElement('a'), { href: url, download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

const _icons = { success: 'check-circle-fill', danger: 'exclamation-triangle-fill',
                 warning: 'exclamation-triangle-fill', info: 'info-circle' };
function setStatus(msg, type = 'info') {
  document.getElementById('status').innerHTML =
    `<span class="text-${type === 'info' ? 'muted' : type}">` +
    `<i class="bi bi-${_icons[type] || _icons.info} me-1"></i>${esc(msg)}</span>`;
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
